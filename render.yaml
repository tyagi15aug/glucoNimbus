# Render Blueprint for GlucoNimbus. Deploy: Render Dashboard -> New ->
# Blueprint -> point at this repo.
#
# apps/web (dashboard + API routes) and LocalStack are deployed here.
# apps/workers is NOT deployed to Render at all — see
# docs/adr/0011-scheduled-worker-for-hosting.md: Render's Free instance
# type has no Background Worker option (only web services, static
# sites, Postgres, and Key Value are free), and rather than pay for a
# Starter instance (~$7/mo) to keep it always-on, it runs as a
# scheduled Google Cloud Run Job instead — see infrastructure/gcp/README.md.
#
# Postgres is Neon, not Render's managed Postgres — Render's free
# Postgres expires after 30 days, Neon's doesn't. DATABASE_URL below is
# `sync: false`: set it once in the Render dashboard after creating a
# Neon project (Neon connection strings aren't something Render can
# provision for you the way `fromDatabase` did).
#
# Free-tier note: LocalStack runs as `type: web`, not `pserv` — Render's
# Free instance type doesn't support private services either. It gets a
# public URL as a side effect; acceptable since it holds no real
# credentials, only fake AWS test resources.
#
# Cold starts on the free plan are expected and accepted (see the Master
# Plan's hosting section / this project's Session 6) — nothing here tries
# to engineer around them.
services:
  - type: web
    runtime: docker
    name: gluconimbus-localstack
    dockerfilePath: ./infrastructure/localstack/Dockerfile
    plan: free
    envVars:
      - key: SERVICES
        value: s3,sqs
      - key: DEBUG
        value: "0"
      - key: PERSISTENCE
        value: "0"
      - key: PORT
        value: "4566"

  - type: web
    runtime: node
    name: gluconimbus-web
    # --include=dev overrides npm's default "skip devDependencies when
    # NODE_ENV=production" behavior (NODE_ENV is set below, and Render
    # applies service env vars during the build step too, not just at
    # runtime). Without it, `typescript` never gets installed, Next.js
    # silently drops the tsconfig `@/*` path-alias resolution, and every
    # `@/...` import in apps/web fails with "Module not found" — confirmed
    # live: this is exactly what broke the first real deploy. tsx (for
    # db:migrate below) is a devDependency too, so it needs this as well.
    buildCommand: npm ci --include=dev && npx turbo run build --filter=@gluconimbus/web... && npm run db:migrate --workspace=@gluconimbus/web
    startCommand: npm run start --workspace=@gluconimbus/web
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # NOT the internal http://gluconimbus-localstack:4566 hostname —
      # confirmed against CloudLab's real deploy that Render's Free
      # instances can send private-network requests but can't receive
      # them, so gluconimbus-localstack (also Free) is unreachable that
      # way regardless of its own health. Its public HTTPS URL works
      # fine — ordinary internet traffic, not Render's private network.
      - key: AWS_ENDPOINT_URL
        value: https://gluconimbus-localstack.onrender.com
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        value: test
      - key: AWS_SECRET_ACCESS_KEY
        value: test
      - key: S3_RAW_BUCKET
        value: gluconimbus-raw
      - key: S3_PROCESSED_BUCKET
        value: gluconimbus-processed
      - key: SQS_QUEUE_NAME
        value: gluconimbus-ingest
      - key: SQS_DLQ_NAME
        value: gluconimbus-ingest-dlq

# apps/workers deploys separately as a Google Cloud Run Job triggered by
# Cloud Scheduler, not as a Render service — see
# infrastructure/gcp/README.md for the full setup. It needs the same
# DATABASE_URL (Neon) and AWS_* values as gluconimbus-web above, plus
# AWS_ENDPOINT_URL pointing at gluconimbus-localstack's public Render URL
# (Cloud Run can't reach Render's private network).
