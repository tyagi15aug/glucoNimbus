name: CI

# Phase 9 (spec Section 24) — see docs/adr/0014-ci-cd.md for the reasoning
# behind every choice below, including what was deliberately left out.
#
# Mirrors the Master Plan's shared CI pipeline shape (Section 14):
#   Checkout -> Install -> Lint -> Typecheck -> Unit tests -> Build -> E2E -> Artifacts
# split into two jobs (checks, e2e) so a lint/typecheck/unit/build failure
# fails fast without spending time on the slower Playwright run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the exact major version this pipeline was built and verified
  # against (see docs/adr/0014-ci-cd.md) rather than the package.json
  # "engines" floor (>=20), to minimize first-run surprises.
  NODE_VERSION: "22"

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gluconimbus
          POSTGRES_PASSWORD: gluconimbus
          POSTGRES_DB: gluconimbus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gluconimbus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # apps/web and apps/workers each load .env/.env.local themselves
      # (db/load-env.ts, apps/workers/src/load-env.ts) — there's no
      # repo-wide env mechanism to hook into instead. DATABASE_URL in
      # .env.example already matches the postgres service's credentials
      # and the 5432 port mapping above, so only AUTH_SECRET (a real
      # secret, not .env.example's placeholder text — see ADR 0012) needs
      # overriding.
      - name: Configure environment
        run: |
          cp .env.example apps/web/.env.local
          cp .env.example apps/workers/.env.local
          SECRET=$(openssl rand -base64 32)
          sed -i "s#^AUTH_SECRET=.*#AUTH_SECRET=$SECRET#" apps/web/.env.local
          sed -i "s#^AUTH_SECRET=.*#AUTH_SECRET=$SECRET#" apps/workers/.env.local

      - name: Apply database schema
        run: npm run db:migrate

      - name: Scaffold CI artifacts directory
        run: mkdir -p ci-artifacts/logs

      # Each step's own log is also captured in the workflow's own log
      # (visible in the Actions UI); `tee`-ing into ci-artifacts/logs/ is
      # what turns that into a retained, downloadable artifact — see the
      # Shared CI Contract (Master Plan Section 8) that
      # docs/adr/0014-ci-cd.md commits this repo to.
      - name: Lint
        run: npm run lint 2>&1 | tee ci-artifacts/logs/lint.log

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee ci-artifacts/logs/typecheck.log

      - name: Unit tests
        run: npm test 2>&1 | tee ci-artifacts/logs/test.log

      - name: Build
        run: npm run build 2>&1 | tee ci-artifacts/logs/build.log

      - name: Write CI metadata
        if: always()
        run: |
          cat > ci-artifacts/metadata.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "workflow": "${{ github.workflow }}",
            "job": "checks",
            "runId": "${{ github.run_id }}",
            "status": "${{ job.status }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-checks
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: End-to-end tests (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gluconimbus
          POSTGRES_PASSWORD: gluconimbus
          POSTGRES_DB: gluconimbus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gluconimbus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure environment
        run: |
          cp .env.example apps/web/.env.local
          SECRET=$(openssl rand -base64 32)
          sed -i "s#^AUTH_SECRET=.*#AUTH_SECRET=$SECRET#" apps/web/.env.local

      - name: Apply database schema
        run: npm run db:migrate

      # Real GitHub-hosted runners have normal internet access, unlike
      # the sandbox playwright.config.ts's PLAYWRIGHT_CHROMIUM_PATH
      # workaround was built for — a plain install is all that's needed
      # here, and PLAYWRIGHT_CHROMIUM_PATH stays unset in CI on purpose.
      - name: Install Playwright's Chromium
        run: npm exec --workspace=@gluconimbus/web -- playwright install --with-deps chromium

      - name: Scaffold CI artifacts directory
        run: mkdir -p ci-artifacts/logs

      # No LocalStack service in this job, on purpose — see
      # docs/adr/0014-ci-cd.md. Several of these tests specifically
      # assert the degraded, LocalStack-unreachable path (503
      # QUEUE_UNAVAILABLE) as the *correct* outcome, matching the same
      # tolerance the suite already has locally (README's Testing
      # section). `CI` is set automatically by GitHub Actions, which
      # playwright.config.ts already keys its retries/reporter/webServer
      # behavior off of.
      - name: Run Playwright suite
        run: npm run test:e2e 2>&1 | tee ci-artifacts/logs/e2e.log

      - name: Write CI metadata
        if: always()
        run: |
          cat > ci-artifacts/metadata.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "workflow": "${{ github.workflow }}",
            "job": "e2e",
            "runId": "${{ github.run_id }}",
            "status": "${{ job.status }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-e2e
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: warn

      # Playwright's own native report/trace output (screenshots+videos
      # aren't currently captured — see playwright.config.ts's `use` block
      # — but retain-on-failure traces and the HTML report are), kept as
      # a separate artifact rather than folded into ci-artifacts/ so
      # `npx playwright show-report` still works unmodified on the
      # downloaded folder.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
